# Ablacao na cozinha (T8, R28), variante seq_com_laco: stride 80, sfm.matcher sequential, loop_detection True.
# Gerado por tools/report/gera_configs_ablacao_cozinha.py; base config_cozinha.yaml.
# Estagios ate SfM + escala + loop_drift + metric_error; saida: cozinha_ablacao/seq_com_laco/
cleanup:
