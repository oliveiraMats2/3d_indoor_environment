# Single default experiment: one YAML = one experiment. Every key is validated by
# main.py and unknown keys are rejected. Run: python main.py --config configs/default.yaml

run:
  id: null                    # null = uses THIS FILE'S NAME; artifacts go to results/<id>/
  output_root: results
  artifacts_root: artifacts
  seed: 42
  log_level: INFO
  overwrite: false
  cache: true

extraction:                   # src/extrair_quadros.py
  rerun: false                # true = extract again (old img_* and selecao.csv in output_dir are deleted); false = reuse frames if selecao.csv exists
  video: video_preview.MOV
  output_dir: frames          # shared by all experiments, gitignored
  min_frames: 100
  max_frames: 300
  overlap: 0.70               # initial overlap target (0.60 to 0.80)
  overlap_min: 0.60
  overlap_max: 0.80
  overlap_step: 0.025
  max_adjust_iters: 12
  stride: 2                   # analyze 1 of every N video frames
  analysis_width: 640
  nfeatures: 1000             # ORB features used only to estimate overlap
  lowe_ratio: 0.75
  min_good_matches: 15
  ransac_threshold_px: 3.0
  min_inliers: 12
  sharp_percentile: 25        # drop the blurriest 25% of sampled frames before selection
  max_width: 1920             # max width of saved frames
  image_format: png           # png = lossless; jpg allowed
  jpeg_quality: 95

frame_quality:                # src/frame_quality.py
  resize_width: 640
  blur:
    laplacian_var_min: 100.0
    relative_to_median: 0.5
  exposure:
    mean_min: 40
    mean_max: 215
    clipped_max_frac: 0.05    # fraction of pixels <= 5 or >= 250
  contrast:
    std_min: 20.0
  texture:
    min_keypoints: 300        # FAST threshold 20
    fast_threshold: 20

detection:                    # src/detectores.py
  methods: [sift, orb, akaze]
  nfeatures: 5000
  reps: 30
  warmup: 2

report:                       # src/relatorio.py
  max_figures: 5

filters:
  lowe_ratio: 0.75            # lower = cleaner and fewer matches; 0.7 to 0.8 is usual (also used by detection)
  min_matches: 10             # pairs below it are success=False

matching:                     # src/matching
  enabled: true
  name: brute_force           # brute_force | flann; exact, FLANN mixes index error with detector quality
  strategy: sequential        # sequential (consecutive frames) | all_pairs (ablation)
  cross_check: false          # must stay false: knnMatch(k=2) for Lowe excludes crossCheck
  reps: 30                    # timed runs per pair, after warmup
  warmup: 2                   # untimed runs discarded before measurement
  flann:
    checks: 50
    float_index: {algorithm: 1, trees: 5}                                          # KDTREE
    binary_index: {algorithm: 6, table_number: 6, key_size: 12, multi_probe_level: 1}  # LSH

geometry:                     # src/epipolar (F/E and RANSAC)
  enabled: true
  ransac:
    method: USAC_MAGSAC       # less sensitive to the hard threshold than RANSAC
    threshold_px: 1.0
    confidence: 0.999
    max_iters: 5000
  intrinsics: {fx: null, fy: null, cx: null, cy: null}   # null fx/fy -> max(w, h); null cx/cy -> w/2, h/2

visualize:
  matches:
    max_lines: 100
    dpi: 150
    format: png
  epilines:
    n_lines: 20
    dpi: 150

evaluation:                   # src/evaluation (not implemented yet)
  enabled: false
  measured_cm: []             # list of {name, value_cm} measured by hand at collection time
  ablation_runs: []           # run ids to compare
