# =============================================================================
# config_cozinha_lidar.yaml: LiDAR capture (short video + LiDAR map) with NO frame filter (selection all, blur off, no cap): every frame is kept
#   and used by SfM and as an MVS reference; GLOMAP (GPU) + all paired MVS densifiers + neural:
#   patch_match, openmvs, plane_sweep, sgm, casmvsnet, mvsnet, patchmatchnet, vggt_omega (VGGT-1B), mapanything
#   frames   : cozinha_lidar/frames/all/
#   output   : cozinha_lidar/results/config_cozinha_lidar/, cozinha_lidar/artifacts/config_cozinha_lidar/
#   keep     : fusion min_num_pixels 3, no outlier removal/crop, Poisson without trimming, larger close_holes, Liepa on
#   scale    : same kitchen as kitchen_my_home (configs/measurements/kitchen_my_home.yaml)
#   run      : python3 main.py config_cozinha_lidar.yaml
#
# Copy of config_on_side_kitchen_all.yaml: the lines marked 'dataset of this copy' differ. No inheritance.
# =============================================================================
flow: gpu                     # flow of this copy: src/flows.py preset (cpu = COLMAP incremental | gpu = GLOMAP + cuDSS container)
# Single default experiment: one YAML = one experiment. Every key is validated by
# main.py and unknown keys are rejected. Run: python3 main.py default.yaml

# Layout (<ws> = extraction.video without extension): <ws>/frames/<tag>/, <ws>/results/<id>/, <ws>/artifacts/<id>/

run:
  id: null                    # THIS FILE'S NAME (config_on_side_kitchen_all)
  output_root: cozinha_lidar/results       # dataset of this copy
  artifacts_root: cozinha_lidar/artifacts
  seed: 42
  log_level: INFO
  overwrite: false
  cache: true

extraction:                   # src/extrair_quadros.py
  rerun: false                # true = extract again (old img_* and selecao.csv in output_dir are deleted); false = reuse frames if selecao.csv exists
  video: cozinha_lidar.MOV    # dataset of this copy: TODO path of the LiDAR video
  output_dir: cozinha_lidar/frames/all  # short capture: every frame kept
  tag: null                   # null = SHA-1[:8] of this block without rerun/tag/output_dir (same params -> same frames)
  selection: all      # dataset of this copy: no overlap selection, no filter             # all = every stride-th frame, dropped only by extraction.blur (overlap/sharp_percentile ignored) | overlap = greedy overlap selection
  min_frames: 0  # dataset of this copy            # all: only warns below it | overlap: lower bound of the target adjustment
  max_frames: null            # dataset of this copy: no cap | null = no cap; all: uniform subsample down to it | overlap: upper bound of the adjustment
  overlap: 0.70               # initial overlap target (0.60 to 0.80); overlap mode only
  overlap_min: 0.60
  overlap_max: 0.80
  overlap_step: 0.025
  max_adjust_iters: 12        # overlap mode only
  stride: 1                   # dataset of this copy: short capture, every frame
  analysis_width: 640
  nfeatures: 1000             # ORB features used only to estimate overlap
  lowe_ratio: 0.75
  min_good_matches: 15
  ransac_threshold_px: 3.0
  min_inliers: 12
  sharp_percentile: 25        # overlap mode only: drop the blurriest 25% of sampled frames before selection
  max_side: 1920              # longest side of saved frames (landscape or portrait: 2160x3840 -> 1080x1920)
  image_format: png           # png = lossless; jpg allowed
  jpeg_quality: 95
  blur:                       # src/extraction/blur.py
    enabled: false            # all frames: no blur/motion flag, nothing excluded from MVS
    coef_min: 0.5             # drop if lapvar / rolling median < coef_min
    motion_ratio_max: 4.0     # drop if structure-tensor lmax/lmin > this (motion blur)
    keep_for_sfm_only: true   # dataset of this copy: flagged frames stay for SfM, listed in mvs_exclude.txt
    window: 9                 # neighbouring sampled frames in the rolling median
    discard_width: 640        # width of the jpg copies in discarded/{blur,motion}/
    discard_jpeg_quality: 90

frame_quality:                # src/frame_quality.py
  resize_width: 640
  blur:
    laplacian_var_min: 0.0      # dataset of this copy: wall lapvar 10.8-71.3, rely on relative_to_median
    relative_to_median: 0.5
  exposure:
    mean_min: 40
    mean_max: 215
    clipped_max_frac: 0.05    # fraction of pixels <= 5 or >= 250
  contrast:
    std_min: 20.0
  texture:
    min_keypoints: 50         # dataset of this copy: median 103 FAST corners per frame
    fast_threshold: 20

detection:                    # src/detectores.py
  methods: [sift, orb, akaze]
  nfeatures: 5000
  reps: 30
  warmup: 2
  max_frames: 100             # uniform subsample of the quality-kept frames fed to detection/matching/geometry/two_view; null = all (COLMAP always uses every frame)

report:                       # src/relatorio.py
  max_figures: 5
  max_rows: 20                # rows per table in report.md

filters:
  cross_check: true           # flow of this copy: mutual NN after Lowe (src/matching/cross_check.py)
  lowe_ratio: 0.75            # lower = cleaner and fewer matches; 0.7 to 0.8 is usual (also used by detection)
  min_matches: 10             # pairs below it are success=False

matching:                     # src/matching
  enabled: true
  name: brute_force           # brute_force | flann; exact, FLANN mixes index error with detector quality
  strategy: sequential        # sequential (consecutive frames) | all_pairs (ablation)
  cross_check: false          # must stay false: knnMatch(k=2) for Lowe excludes crossCheck
  reps: 30                    # timed runs per pair, after warmup
  warmup: 2                   # untimed runs discarded before measurement
  flann:
    checks: 50
    float_index: {algorithm: 1, trees: 5}                                          # KDTREE
    binary_index: {algorithm: 6, table_number: 6, key_size: 12, multi_probe_level: 1}  # LSH

geometry:                     # src/epipolar (F/E and RANSAC)
  enabled: true
  ransac:
    method: USAC_MAGSAC       # less sensitive to the hard threshold than RANSAC
    threshold_px: 1.0
    confidence: 0.999
    max_iters: 5000
  # dataset of this copy: phone 1x lens, 1920x1080 landscape (same value that registered 194/194 on video_preview)
  # (and by sfm.intrinsics: fixed). null fx/fy -> max(w, h); null cx/cy -> w/2, h/2
  intrinsics: {fx: 1470.0, fy: 1470.0, cx: 960.0, cy: 540.0} # dataset of this copy

visualize:
  matches:
    enabled: true             # flow of this copy: inlier samples (R3)            # true = save matching figures (Lowe + RANSAC inliers) for `samples` pairs
    samples: 5                # registered pairs per detector, evenly spread over the sequence
    max_lines: 100
    dpi: 150
    format: png
  epilines:
    n_lines: 20
    dpi: 150

sfm:                          # src/sfm/colmap.py + convert.py (COLMAP >= 4.0 CLI; older -> WARNING, stage skipped)
  enabled: true
  technique: glomap  # flow of this copy (src/flows.py) | colmap | glomap | instantsfm | mast3r_sfm | vggt (README.md, GPU SfM techniques)
  rerun: false                # false + existing sparse/0/images.bin -> reuse the model
  colmap_bin: colmap          # not found -> WARNING, stage skipped
  camera_model: OPENCV        # fx,fy,cx,cy,k1,k2,p1,p2
  single_camera: true         # one shared camera (same phone/zoom)
  intrinsics: estimate        # dataset of this copy: 1080p capture, crop not known to match the 4K fx=1470 | estimate: COLMAP estimates | fixed: geometry.intrinsics + fixed_dist, not refined in BA
  fixed_dist: [0, 0, 0, 0]    # k1,k2,p1,p2 used only with intrinsics: fixed
  matcher: sequential         # sequential | exhaustive
  sequential_overlap: 10      # neighbours matched per frame (sequential)
  loop_detection: true        # dataset of this copy: long walk ending near the start; needs vocab_tree (cached)
  vocab_tree: "https://github.com/colmap/colmap/releases/download/3.11.1/vocab_tree_faiss_flickr100K_words256K.bin;vocab_tree_faiss_flickr100K_words256K.bin;96ca8ec8ea60b1f73465aaf2c401fd3b3ca75cdba2d3c50d6a2f6f760f275ddc"  # path or COLMAP url;name;sha256 (downloaded and cached by COLMAP), used only with loop_detection
  mapper: global  # flow of this copy | incremental (mapper) | global (global_mapper, GLOMAP)
  use_gpu: auto               # auto = GPU when COLMAP is built with CUDA and nvidia-smi sees a GPU | true | false (SIFT + matching)
  gpu_index: "0"
  ba_use_gpu: false           # BA on Ceres CUDA
  max_image_size: 1920        # max side for SIFT extraction
  max_num_features: 8192
  min_num_matches: 15         # min matches per pair for the mapper
  multiple_models: true       # allow several submodels; the largest goes to sparse/0
  ba_global_max_num_iterations: null  # null = COLMAP default (incremental only)
  ba_global_max_refinements: null     # null = COLMAP default (incremental only)
  ba_global_frames_ratio: null        # null = COLMAP 1.1; 1.3 = fewer global BAs, ~30-50% faster (incremental only)
  project_quality: high       # project_generator --quality: low|medium|high|extreme
  link_images: auto           # exports/colmap/images/: auto = hardlink, copy if refused | hardlink | symlink (relative) | copy
  backend: auto               # auto = COLMAP CLI when colmap_bin is found (primary), else pycolmap (uv sync --extra cpu|cuda) | cli | pycolmap
  instantsfm:                 # src/sfm/instantsfm.py: SIFT/matching above + InstantSfM global mapper on the GPU (CC BY-NC 4.0)
    num_iteration_bundle_adjustment: 3
    ba_max_num_iterations: 100
    skip_view_graph_calibration: false
    skip_retriangulation: true
    skip_pruning: true
    max_frames: null          # null = every frame
    min_track_length: 3       # shorter tracks dropped before positioning/BA; raise it when the GPU runs out of memory
    ba: false                 # extra pycolmap BA after retriangulating with its poses (it already ran its GPU BA)
    min_points_per_image: 50  # images seeing fewer 3D points are deregistered
  mast3r_sfm:                 # src/sfm/mast3r_sfm.py: MASt3R pairs + sparse global alignment (CC BY-NC-SA 4.0)
    repo_dir: ~/mast3r        # git clone --recursive https://github.com/naver/mast3r (README.md, GPU SfM techniques)
    weights: naver/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric  # official checkpoint (Hugging Face hub)
    retrieval_url: https://download.europe.naverlabs.com/ComputerVision/MASt3R  # official retrieval .pth + codebook
    weights_dir: ~/.cache/mast3r
    image_size: 512
    max_frames: 200           # uniform subsample: pairs, time and VRAM grow with it
    scene_graph: retrieval    # retrieval (retrieval-Na-k, needs asmk) | swin (sliding window)
    retrieval_na: 20
    retrieval_k: 10
    window: 10                # swin only
    lr1: 0.07
    niter1: 300
    lr2: 0.01
    niter2: 300
    optim_level: refine+depth # coarse | refine | refine+depth
    matching_conf_thr: 0.0
    shared_intrinsics: true
    subsample: 8
    ba: true                  # pycolmap BA on the SIFT tracks triangulated with the MASt3R poses
    refine_intrinsics: true
    matcher: exhaustive       # SIFT pairs of the subsampled frames (far apart in time) | sfm = sfm.matcher
    min_points_per_image: 50  # images seeing fewer 3D points are deregistered (textureless views; dense needs sources)
  vggt:                       # src/sfm/vggt.py: one feed-forward pass for the cameras
    weights: facebook/VGGT-1B # official weights (CC BY-NC 4.0); facebook/VGGT-1B-Commercial is gated (HF login)
    image_size: 518           # long side; short side keeps the aspect (multiple of 14)
    max_frames: 80            # uniform subsample: a single pass must fit in VRAM
    dtype: auto               # auto = bf16 on sm_80+ | bf16 | fp16 | fp32
    ba: true                  # pycolmap BA on the SIFT tracks triangulated with the VGGT poses
    refine_intrinsics: true
    matcher: exhaustive       # SIFT pairs of the subsampled frames (far apart in time) | sfm = sfm.matcher
    min_points_per_image: 50  # images seeing fewer 3D points are deregistered (textureless views; dense needs sources)

scale:                        # src/sfm/scale.py
  enabled: true
  method: outline             # flow of this copy: tape-measured outline (src/sfm/scale_outline.py) | aruco | manual
  aruco_dict: DICT_4X4_50     # cv2.aruco.DICT_* name
  marker_cm: null             # real marker side in cm; null -> scale unknown (unit=model)
  min_parallax_deg: 1.0       # frame pairs with less parallax are ignored when triangulating the marker
  manual_pairs: []            # [{length_cm, p: [{image,x,y},{image,x,y}], q: [{image,x,y},{image,x,y}]}]
  provisional_extent_cm: 500  # only used to turn *_cm thresholds into model units when unit=model
  outline:
    measurements: configs/measurements/kitchen_my_home.yaml  # flow of this copy: contorno_cm
    wall_band: [0.7, 0.99]    # dataset of this copy: best fit of the band sweep (median 0.8 cm, p90 5 cm, inliers 95%)
    min_support: 0.4          # dataset of this copy: the video covers ~46% of the outline (one side of the kitchen);
                              # the fitted scale is stable across bands (0.061-0.063 units/cm), only the support is low

cleanup:                      # src/cloud/clean.py (sparse and each dense method)
  enabled: true
  voxel_cm: 1.0               # voxel downsampling side
  nb_neighbors: 20            # statistical outlier removal neighbours
  std_ratio: 100.0            # keep: no outlier removal | drop points with mean distance > mean + std_ratio * std
  crop_percentiles: [0, 100]  # keep: no crop | axis-aligned box removing extreme tails (floaters)
  device: CPU:0               # flow of this copy: faster than CUDA here and keeps VRAM for Gaussian Splatting | auto = CUDA:0 when Open3D sees a CUDA GPU, else CPU:0 | CPU:0 | CUDA:0

planes:                       # src/cloud/planes.py
  enabled: true
  source: sparse              # sparse | patch_match | openmvs -> clean/<source>/points.npy
  distance_cm: 2.0            # RANSAC inlier threshold
  ransac_n: 3
  iterations: 2000
  max_walls: 8                # flow of this copy: 5 walls incl. the 135 deg chamfer
  min_inlier_frac: 0.02       # min plane inliers / total points (also stop criterion)
  angle_tol_deg: 15           # tolerance for horizontal / vertical planes
  max_planes: 10              # max RANSAC rounds

floorplan:                    # src/cloud/floorplan.py
  enabled: true
  cell_cm: 5.0                # grid cell side
  dpi: 150
  fig_inches: 8.0             # longest side of the figure in inches
  extent_percentiles: [1, 99] # robust percentiles for the room rectangle sides
  fallback: [percentiles, room_fill]  # flow of this copy: percentiles first (room_fill is fitted on the tape outline)

dense:                        # src/dense (patch_match.py, openmvs.py)
  enabled: true
  rerun: false                # false: reuse dense/<method>/fused.ply
  methods: [patch_match, openmvs, plane_sweep, sgm, casmvsnet, mvsnet, patchmatchnet, vggt_omega, mapanything]  # keep MVS + neural
  max_image_size: 1600        # longest side (px); VRAM and time grow ~side^2; 640 = quick test
  gpu_index: "0"              # "-1" = all GPUs
  ref_step: 1   # flow of this copy: 300 frames               # 1 of every N registered frames is an MVS reference; the rest stay source views (~N x faster)
  patch_match:
    num_iterations: 3         # COLMAP usually converges in 3 (default 5); time is linear
    window_radius: 5          # NCC window (2r+1)^2
    num_samples: 15           # Monte Carlo source-view samples per pixel
    num_src_images: 20        # source images per reference
    geom_consistency: true    # photometric + geometric pass (~2x time, much less noise)
    cache_size: 32            # GB of CPU RAM cache
  fusion:
    min_num_pixels: 3         # keep | min consistent pixels per point
    max_reproj_error: 2.0     # px
    max_depth_error: 0.01     # relative
    cache_size: 32            # GB
  openmvs:
    bin_dir: null             # folder with InterfaceCOLMAP/DensifyPointCloud; null = PATH
    container: t2/openmvs:2.4.0  # flow of this copy: docker/openmvs (CUDA)
    resolution_level: 1       # 0 = full resolution, 1 = half, ...
    number_views: 5           # neighbour views per depth map (0 = all)
    max_threads: 0            # 0 = all cores
  vggt_omega:
    model: vggt_1b            # flow of this copy: VGGT-1B stands in for VGGT-Omega until access to the gated facebook/VGGT-Omega (hf auth login) | vggt_omega
    checkpoint: null          # local VGGT-Omega .pt (skips the Hugging Face download)
  mapanything:
    voxel: 0.04               # flow of this copy: ~1 cm (auto = ~5 cm)

dense_compare:                # src/dense/compare.py
  enabled: true

gaussian_splatting:           # src/gs/gaussian_splatting.py (Inria 3DGS, novel-view synthesis benchmark; optional, CUDA only)
  enabled: false              # keep: in config_gpu.yaml | novel-view benchmark next to the COLMAP reconstruction
  rerun: false                # false: reuse gaussian_splatting/data and model/point_cloud/iteration_<iterations>
  repo_dir: ~/gaussian-splatting  # clone of github.com/graphdeco-inria/gaussian-splatting (train.py, render.py, metrics.py)
  python: ~/gaussian-splatting/.venv/bin/python  # interpreter with torch + the built submodules
  iterations: 30000           # training iterations (Inria default; 7000 = quick test)
  eval: true                  # hold out every 8th image (llffhold) as test views for PSNR/SSIM/LPIPS
  resolution: -1              # Inria -r: -1 = auto (at most 1600 px wide) | 1, 2, 4, 8 = downscale factor | else target width
  max_image_size: 1600        # image_undistorter --max_image_size (longest side of the training images)
  data_device: cpu            # cpu | cuda; cpu: thousands of frames do not fit in 16 GB VRAM
  sh_degree: 3                # spherical harmonics degree of the Gaussian colours
  gpu_index: "0"              # CUDA_VISIBLE_DEVICES of train/render/metrics
  timeout_s: null             # null = no limit; else kill each command after this many seconds

poisson:                      # src/mesh/poisson.py (Open3D)
  enabled: true
  source: dense               # dense -> first dense.methods with output, else sparse (WARNING) | sparse
  variants: [pre, raw]        # pre = cleaned cloud (cleanup stage) | raw = same cloud without cleanup
  depth: 10                   # octree depth (higher = finer, slower)
  density_quantile: 0.0       # keep: no trimming | drop vertices with Poisson density below this quantile
  normal_knn: 30              # neighbours for normal estimation
  threads: 32                 # dataset of this copy: all 32 cores | Poisson threads (-1 = all cores)
  method: [null, openmvs, plane_sweep, sgm, casmvsnet, mvsnet, patchmatchnet, vggt_omega, mapanything]  # one mesh per method (null = default)

close_holes:                  # src/mesh/close_holes.py (pymeshlab, MeshLab "Close Holes"; no pymeshlab -> WARNING, skipped)
  enabled: true
  variants: [pre, raw]        # pre = repair (dedupe, non-manifold, small pieces) then close | raw = close directly
  max_hole_size: 300          # keep | max hole size in boundary edges (MeshLab maxholesize)
  min_component_frac: 0.01    # pre: remove isolated pieces smaller than this fraction of the bbox diagonal
  self_intersection: true     # forbid patches that self-intersect (MeshLab selfintersection)

liepa:                        # src/mesh/liepa.py (Liepa 2003 hole filling: triangulate + refine + fair; optional)
  enabled: true               # keep | true -> exports/meshlab/liepa_scene.ply (+ mesh/liepa/); false -> stage skipped
  input: poisson              # poisson (pre) | close_holes (pre_pre): mesh whose holes are filled
  max_hole_edges: 1000        # keep | holes with more boundary edges are left open (keeps the scene border open)
  density: 1.4142135623730951 # refinement alpha (Liepa sqrt(2)); higher = denser patch
  fairing: 2                  # 2 = thin plate (bi-Laplacian, paper) | 1 = membrane (Laplacian) | 0 = flat, no fairing
  max_refine_iters: 30        # cap on the split/relax rounds per hole

room_fill:                    # src/mesh/room_fill.py: flat floor/ceiling (walls) from a hand-measured room outline
  enabled: true               # dataset of this copy: textureless floor/ceiling missing from the Poisson mesh
  # dataset of this copy: kitchen outline measured by hand (cm), origin at the window/fridge corner, x along the
  # window wall, y along the fridge wall; source and photos: kitchen_my_home/medidas/ (medidas.yaml, contorno_cm)
  footprint_cm: [[0, 0], [273, 0], [273, 429], [81.1, 424.5], [0, 332]]
  ceiling_height_cm: null     # null = estimated from the reconstruction (ceiling plane, else top percentile of points)
  surfaces: [floor, ceiling]  # any of floor | ceiling | walls
  source: patch_match         # cloud used for the fit and the coverage test: sparse | patch_match | openmvs (clean/<source>/points.npy)
  grid_cm: 5.0                # side of the fill grid cells
  max_gap_cm: 5.0             # a cell closer than this to the reconstruction is already covered (not filled)
  fit_rotations: 72           # initial rotations tried by the outline fit
  wall_band: [0.80, 0.97]     # dataset of this copy: outline measured along the ceiling molding -> fit on the band right below the ceiling, above the furniture

mesh:                         # src/mesh/mesh.py (formats + scene of ONE chosen mesh)
  enabled: true
  input: close_holes          # close_holes (pre_pre) | poisson (pre) | liepa: mesh exported to PLY/OBJ/STL/OFF/GLB
  frustum_cm: 20              # camera pyramid depth
  frustum_every: 5            # draw 1 camera every N
  trajectory_cm: 1.0          # trajectory tube diameter

export:                       # src/export/meshlab.py (MeshLab project + filter script)
  enabled: true
  normals_k: 10               # neighbours for normals
  normals_smooth_iter: 0
  poisson_depth: 10           # Screened Poisson octree depth
  poisson_samples_per_node: 1.5  # 1-5 clean cloud, 15-20 noisy cloud
  poisson_point_weight: 4.0   # 0 = classic Poisson
  isolated_diameter_frac: 0.1 # remove pieces with diameter < frac * bbox diagonal

viewer:                       # src/viewer.py: main.py records the orbit; python3 view.py <this file> opens the window
  enabled: true               # main.py records <run_dir>/videos/navigation_<cloud>_<seconds>s.mp4 (child process: a renderer crash only skips the video)
  cloud: sparse               # sparse | mesh | <dense method>
  clouds: [sparse, patch_match]  # flow of this copy: one navigation video per cloud
  seconds: 45
  fps: 30
  offscreen: auto             # auto = hidden Open3D window with a display, else OffscreenRenderer (EGL) | true | false
  timeout_s: 1800             # kill the recording process after this many seconds
  width: 1280
  height: 720
  frustum_cm: 20
  point_size: 2.0
  fov_deg: 60.0               # vertical FOV of the orbit camera
  orbit_radius_factor: 1.5    # orbit radius = factor * robust half-diagonal of the scene
  orbit_elevation_deg: 30.0
  background: [1.0, 1.0, 1.0]

videos:                       # src/videos.py
  enabled: true
  topdown_fps: 10             # fps of trajectory_topdown.mp4 (1 frame per camera)
  kept_vs_discarded: false     # writes frames_kept_vs_discarded.mp4
  width: 960                  # output width (height proportional, even)
  codec: auto                 # auto = avc1 (H.264) if the OpenCV build can encode it, else mp4v | any cv2.VideoWriter fourcc

evaluation:                   # src/evaluation
  enabled: true
  measured_cm: []             # [{name: room_width|room_length|ceiling_height, value_cm}] measured by hand
  measurements_file: configs/measurements/kitchen_my_home.yaml  # flow of this copy: wall lengths (tape)
  metric_scale: leave_one_out  # flow of this copy: each wall scaled by the OTHER walls (the outline scale is fitted on them)
  ablation_runs: []           # run ids to compare (configs/experiments/ablation.yaml)
  loop_closed: null           # dataset of this copy: one side of the kitchen, the walk does not return to the start (loop_drift auto-detects) | true | false
  hard_regions: true          # smooth vs textured wall reprojection (needs planes)
  texture_radius_px: 30       # radius of local keypoint density
  texture_split_quantile: 0.5 # texture quantile splitting smooth_wall / textured_wall
  inlier_px: 2.0              # point is inlier if its mean reprojection error < inlier_px

photo_vs_render:              # src/evaluation/photo_vs_render.py (T2 4.B.3)
  enabled: true
  n_views: 6
  source: mesh                # mesh | dense | sparse
  max_size: 960
  point_px: 4
  gs: true                    # third column with the Gaussian Splatting render when it exists

lidar:                        # src/evaluation/lidar.py: real LiDAR map of the kitchen = ground truth
  path: null                  # dataset of this copy: TODO LiDAR file of this capture (.ply/.obj/.las/.laz/.e57)
  unit: m
  voxel_cm: 1.0
  taus_cm: [2, 5, 10]
  icp_voxels_cm: [8, 4, 2]
  methods: auto

# flow gpu: neural reconstructions (dense.methods vggt_omega, mapanything)
