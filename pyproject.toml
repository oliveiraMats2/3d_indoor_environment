[project]
name = "3d-indoor-environment"
version = "0.1.0"
# <3.13: open3d 0.19 (the last release with macOS Intel wheels) ships cp310-cp312 only
requires-python = ">=3.10,<3.13"
dependencies = [
    "opencv-contrib-python>=5.0.0.93,<6",  # OpenCV 5 API (xfeatures2d, aruco.ArucoDetector); wheels: manylinux_2_17+, macOS arm64 13+, x86_64 14+
    "numpy>=2,<3",
    "pyyaml>=6",
    "pydantic>=2,<3",
    "tqdm>=4.66",
    "trimesh>=4,<6",
    # open3d wheels: 0.20 = Linux glibc>=2.35 (x86_64, aarch64), macOS arm64, Windows; 0.19 = macOS Intel (universal2)
    "open3d==0.20.*; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "open3d==0.19.*; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # pymeshlab has wheels only (no sdist): Linux glibc>=2.35 x86_64/aarch64, macOS 11+ arm64/x86_64, Windows amd64.
    # Elsewhere it is not installed and the close_holes stage skips with a WARNING.
    "pymeshlab>=2023.12; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "pandas>=2",
    "matplotlib>=3.8",
    "networkx>=3",
    "jinja2>=3.1",
    "plotly>=5",
    "scipy>=1.15.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.optional-dependencies]
# pycolmap: OPTIONAL SfM/dense backend, used only when the `colmap` CLI is missing (sfm.backend: auto) or with
# sfm.backend: pycolmap. cpu and cuda are MUTUALLY EXCLUSIVE (both ship the `pycolmap` module): pick one,
# `uv sync --extra cpu` or `uv sync --extra cuda`; with pip install only `pycolmap` or only `pycolmap-cuda12`.
# cpu wheels: macOS arm64 14+, Linux x86_64 manylinux_2_28, Windows amd64. cuda: Linux x86_64 + NVIDIA driver.
cpu = ["pycolmap>=4.2,<5; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')"]
cuda = ["pycolmap-cuda12>=4.2,<5; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

# No [build-system]: an application, not a package. Install: `uv sync` (creates .venv from uv.lock), or
# `python3 -m venv .venv` + `.venv/bin/pip install` of the dependencies above; then activate .venv.
